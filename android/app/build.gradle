plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing is read from android/key.properties, which is gitignored.
// If that file is absent (fresh clone, CI without secrets) the release build
// falls back to the debug key so the build still succeeds -- but such an APK
// cannot be published to the Play Store.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // NOTE: this must stay in sync with the package_name in
    // android/app/google-services.json, or Firebase init fails at runtime.
    namespace = "com.example.eduvision_0_1"

    compileSdk = flutter.compileSdkVersion

    // Pinned rather than using flutter.ndkVersion: the `jni` transitive
    // dependency requires 28.2, and a mismatch fails with a confusing
    // "requires Android NDK <version>" error.
    ndkVersion = "28.2.13676358"

    compileOptions {
        // Java 17 across the whole project. The old config compiled the app at
        // 1.8 while forcing subprojects to 17, which conflicted.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId = "com.example.eduvision_0_1"
        // 23 is the floor for Firebase Auth.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by flutter_local_notifications-style APIs and by java.time usage
    // on minSdk < 26; also what coreLibraryDesugaringEnabled needs.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
