# Gradle settings to optimize build performance and compatibility

# Increase the maximum heap size for the Gradle daemon (helps avoid OutOfMemory errors)
org.gradle.jvmargs=-Xmx2048M

# Enable support for AndroidX (required for most modern libraries)
android.useAndroidX=true

# Automatically convert older libraries to AndroidX (useful when using older dependencies)
android.enableJetifier=true

# Enable or disable the generation of BuildConfig class (enabled by default, but can be useful to control)
android.defaults.buildfeatures.buildconfig=true

# Disable resource ID finalization (helps improve build times for large projects)
android.nonFinalResIds=false

# Disable transitive R classes (useful for libraries that don't need it)
android.nonTransitiveRClass=false

# Enable parallel execution of Gradle tasks (speeds up the build process by utilizing multiple CPU cores)
org.gradle.parallel=true

# Optional: Set the specific Java version to ensure compatibility (if using JDK 17)
# Make sure the path is correct based on where JDK is installed on your machine
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Enable Gradle daemon (usually enabled by default, but here for completeness)
org.gradle.daemon=true

# Configure cache settings to improve build speed
org.gradle.caching=true

# Optional: If you're facing cache issues, disable daemon temporarily for debugging
# org.gradle.daemon=false