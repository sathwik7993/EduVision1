org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true

# AGP 8 defaults. Jetifier is not needed -- no support-library dependencies remain.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# NOTE: org.gradle.java.home is intentionally NOT set here. Hardcoding a JDK path
# makes the build machine-specific and fails on any other developer's machine.
# Point Flutter at your JDK instead:  flutter config --jdk-dir "<path>"
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
