// Top-level build file.
//
// Plugin versions are declared in settings.gradle via the plugins {} block.
// This file deliberately contains no buildscript {} block -- having one here
// as well is what caused the AGP 8.0.2 / 8.1.0 version conflict.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect all build output to <project>/build, which is where the Flutter tool
// looks for the packaged APK. Without this the build succeeds but `flutter build
// apk` reports "Gradle build failed to produce an .apk file".
//
// This uses layout.buildDirectory rather than the `rootProject.buildDir = ...`
// assignment the project had before, which is deprecated and removed in Gradle 9.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
    // Plugin modules must be configured after :app so they inherit its
    // compileSdk and namespace settings.
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
