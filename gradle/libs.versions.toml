[versions]
agp = "8.13.2"
kotlin = "2.2.21"
# Same Java API on both sides: the JVM artifact runs the core tests on the host,
# the Android artifact ships in the app.
onnxruntime = "1.22.0"
opencvAndroid = "4.10.0"
opencvJvm = "4.9.0-0"
composeBom = "2026.09.00"
firebaseBom = "35.1.0"

[libraries]
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
opencv-android = { module = "org.opencv:opencv", version.ref = "opencvAndroid" }
opencv-jvm = { module = "org.openpnp:opencv", version.ref = "opencvJvm" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
junit = { module = "junit:junit", version = "4.13.2" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }
kotlinx-coroutines-play = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version = "1.10.2" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.9.4" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version = "1.6.2" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.6.2" }
camera-view = { module = "androidx.camera:camera-view", version = "1.6.2" }
mlkit-docscanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version = "16.0.0" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
credentials = { module = "androidx.credentials:credentials", version = "1.6.0" }
credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version = "1.6.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version = "1.2.1" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
